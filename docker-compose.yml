services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-2.5-flash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173}
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      ARTIFACTS_ROOT: /data/artifacts
      ARTIFACT_CLEANUP_ENABLED: ${ARTIFACT_CLEANUP_ENABLED:-true}
      ARTIFACT_CLEANUP_INTERVAL_MINUTES: ${ARTIFACT_CLEANUP_INTERVAL_MINUTES:-10}
      DELIVERED_ARTIFACT_RETENTION_MINUTES: ${DELIVERED_ARTIFACT_RETENTION_MINUTES:-30}
      STALE_ARTIFACT_RETENTION_HOURS: ${STALE_ARTIFACT_RETENTION_HOURS:-6}
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
